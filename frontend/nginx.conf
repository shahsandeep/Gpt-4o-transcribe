server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets emitted by Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every other route serves index.html so client routing works
  # and a hard refresh never 404s.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
